services:
  - type: web
    name: spring-ai
    runtime: docker
    dockerfilePath: ./spring-ai/Dockerfile
    envVars:
      - key: OPENROUTER_API_KEY
        value: your-openrouter-key   # set via Render dashboard UI
      - key: PORT
        value: "8080"
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_CHAT_MODEL
        value: openrouter/free
      - key: SPRING_PROFILES_ACTIVE
        value: render
    autoDeploy: true
    region: oregon
